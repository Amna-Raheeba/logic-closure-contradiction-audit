[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-closure-contradiction-audit"
version = "0.1.0"
description = "Audits a recorded prediction log -- no model access needed -- for logical contradictions among linked items: implication-graph closure violations with witness paths, confidence-weighted violation rates, and minimal correction sets."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
